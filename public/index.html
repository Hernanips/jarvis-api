<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #121215;
            --bg-card: #18181b;
            --border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            padding: 14px 20px;
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .lock-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chip:hover { color: var(--text-main); border-color: #52525b; background: #27272a; }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .message {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 82%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #fff; font-weight: 600; }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-wrapper {
            padding: 14px 20px 20px;
            background: var(--bg-main);
            border-top: 1px solid var(--border);
        }

        .input-area {
            display: flex;
            gap: 8px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            transition: border-color 0.2s;
        }
        .input-area:focus-within { border-color: #52525b; }

        input {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-size: 14.5px;
        }
        input::placeholder { color: #52525b; }

        .icon-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: #27272a; color: var(--text-main); }
        .icon-btn.recording { color: var(--accent); animation: pulse 1s infinite; }

        .send-btn {
            padding: 0 18px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }

        /* MODAL DE LOGIN */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.96);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .google-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- MODAL DE ACCESO CON GOOGLE -->
    <div id="auth-modal">
        <div class="modal-card">
            <h2>🔒 JARVIS // AUTH</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">Inicia sesión con tu cuenta de Google para sincronizar tus tareas y base de datos de forma segura.</p>
            <button class="google-btn" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 11.7c0 1.83.43 3.56 1.18 5.08l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <header>
        <div class="brand">
            <span class="status-dot"></span>
            JARVIS // CORE V2
        </div>
        <button class="lock-btn" onclick="logout()">Cerrar sesión</button>
    </header>

    <div class="quick-actions">
        <button class="chip" onclick="enviarRapido('¿Cómo llevo el día? Dime tareas pendientes y calorías')">📋 Resumen del día</button>
        <button class="chip" onclick="enviarRapido('¿Qué tengo pendiente en Project OBSCURA?')">🎮 Project OBSCURA</button>
        <button class="chip" onclick="enviarRapido('¿Cómo llevo las tareas de la Pecera?')">🐟 Estado Pecera</button>
        <button class="chip" onclick="enviarRapido('¿Qué tareas tengo pendientes de la Uni?')">🎨 Uni</button>
    </div>
    
    <div id="chat-box">
        <div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>
    </div>

    <div class="input-wrapper">
        <div class="input-area">
            <button class="icon-btn" id="micBtn" onclick="toggleDictado()" title="Hablar">🎤</button>
            <input type="text" id="userInput" placeholder="Escribe o dicta tu orden..." autofocus>
            <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        const authModal = document.getElementById('auth-modal');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        let historial = [];

        // Cargar configuración de Supabase desde el backend de forma segura
        async function initApp() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();

                // Inicializar cliente de Supabase con las credenciales del .env
                supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                // Comprobar sesión activa
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    authModal.style.display = 'none';
                } else {
                    authModal.style.display = 'flex';
                }
            } catch (e) {
                console.error("Error al inicializar la app:", e);
            }
        }

        initApp();

        async function loginGoogle() {
            if (!supabaseClient) return;
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    scopes: 'https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar'
                }
            });
        }

        async function logout() {
            if (!supabaseClient) return;
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function formatearTexto(texto) {
            return texto
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        function enviarRapido(texto) {
            userInput.value = texto;
            enviarMensaje();
        }

        async function enviarMensaje() {
            const text = userInput.value.trim();
            if (!text) return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                authModal.style.display = 'flex';
                return;
            }

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}` // <-- Enviamos el token seguro de Supabase
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                if (res.status === 401) {
                    authModal.style.display = 'flex';
                    return;
                }

                const data = await res.json();
                const reply = data.reply || data.error;

                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}</div>`;
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">Error de conexión con el servidor.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.onstart = () => document.getElementById('micBtn').classList.add('recording');
            recognition.onend = () => document.getElementById('micBtn').classList.remove('recording');
            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
                enviarMensaje();
            };
        }

        function toggleDictado() {
            if (!recognition) return alert('Tu navegador no soporta dictado por voz.');
            recognition.start();
        }
    </script>
</body>
</html>
