<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>JARVIS // OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #121215;
            --bg-card: #18181b;
            --bg-input: #1e1e22;
            --border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            padding-bottom: 14px;
            padding-left: max(20px, env(safe-area-inset-left, 20px));
            padding-right: max(20px, env(safe-area-inset-right, 20px));
            background: rgba(18, 18, 21, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .lock-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        /* BARRA DE ATAJOS */
        .quick-actions-bar {
            border-bottom: 1px solid var(--border);
            background: var(--bg-main);
            flex-shrink: 0;
            width: 100%;
        }

        .quick-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .chip:hover:not(:disabled) { color: var(--text-main); border-color: #52525b; background: #27272a; }
        .chip:disabled { opacity: 0.45; cursor: not-allowed; }

        .chip-action {
            background: transparent;
            border: 1px dashed #3f3f46;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .chip-action:hover { color: var(--text-main); border-color: var(--text-muted); background: var(--bg-card); }

        /* CHAT BOX */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .message {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 84%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #fff; font-weight: 600; }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ZONA INFERIOR */
        .input-wrapper {
            padding-top: 12px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            padding-left: max(16px, env(safe-area-inset-left, 16px));
            padding-right: max(16px, env(safe-area-inset-right, 16px));
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            width: 100%;
        }

        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 10px 8px 18px;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-area:focus-within { border-color: #52525b; }
        .input-area.listening {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.25);
        }

        textarea#userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.45;
            resize: none;
            max-height: 140px;
            min-height: 24px;
            padding: 6px 0;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        textarea#userInput::placeholder { color: #71717a; }
        textarea#userInput:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ONDAS DE AUDIO DENTRO DE LA CAJA (ESTILO GEMINI) */
        .box-audio-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
            flex: 1;
        }
        .input-area.listening textarea#userInput { display: none; }
        .input-area.listening .box-audio-indicator { display: flex; }

        .gemini-waves {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            height: 18px;
        }
        .gemini-waves span {
            width: 3.5px;
            background-color: var(--accent);
            border-radius: 99px;
            animation: gWave 0.8s infinite ease-in-out;
        }
        .gemini-waves span:nth-child(1) { height: 6px; animation-delay: 0s; }
        .gemini-waves span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
        .gemini-waves span:nth-child(3) { height: 10px; animation-delay: 0.3s; }
        .gemini-waves span:nth-child(4) { height: 14px; animation-delay: 0.45s; }

        @keyframes gWave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1.2); opacity: 1; }
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            padding-bottom: 1px;
        }

        /* BOTÓN DE MICRÓFONO */
        .mic-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .mic-btn:hover:not(:disabled) { background: #27272a; color: var(--text-main); }
        .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .mic-btn.recording {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent);
        }

        /* BOTÓN DE ENVIAR */
        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.03); }
        .send-btn:disabled {
            background: #27272a;
            color: #52525b;
            cursor: not-allowed;
            transform: none;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .google-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }

        /* EDITOR DE ATAJOS ESTILO NOTION */
        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
        }
        .shortcut-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .shortcut-icon-preview {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        .shortcut-text-group {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .shortcut-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shortcut-prompt {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .shortcut-item-actions {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background: #27272a;
            border: none;
            color: var(--text-main);
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .mini-btn.delete { color: #f87171; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 8px;
        }
        .form-input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus { border-color: #52525b; }
        .icon-input {
            width: 56px;
            text-align: center;
            font-size: 18px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- MODAL DE ACCESO CON GOOGLE -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2>🔒 JARVIS // AUTH</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">Inicia sesión con tu cuenta de Google para sincronizar tus tareas y base de datos de forma segura.</p>
            <button class="google-btn" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 11.7c0 1.83.43 3.56 1.18 5.08l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- MODAL DE GESTIÓN DE ATAJOS (ESTILO NOTION) -->
    <div id="shortcuts-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>⚡ ATAJOS RÁPIDOS</h2>
                <button class="btn-secondary" onclick="cerrarModalAtajos()" style="padding: 4px 10px;">✕</button>
            </div>
            <p style="font-size: 12.5px; color: var(--text-muted);">Personaliza tus botones de acceso rápido.</p>

            <div id="shortcuts-list" class="shortcut-list"></div>

            <hr style="border: none; border-top: 1px solid var(--border);">

            <div class="form-group">
                <label id="form-shortcut-title">Añadir nuevo atajo</label>
                <div class="form-row">
                    <input type="text" id="shortcutIconInput" class="form-input icon-input" placeholder="📋" maxlength="4">
                    <input type="text" id="shortcutLabelInput" class="form-input" style="flex:1;" placeholder="Etiqueta del botón (ej: Resumen del día)">
                </div>
                <input type="text" id="shortcutPromptInput" class="form-input" placeholder="Prompt a enviar (ej: ¿Cómo llevo el día?)">
                <input type="hidden" id="shortcutEditIndex" value="-1">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelEditBtn" onclick="resetFormularioAtajo()" style="display: none;">Cancelar</button>
                <button class="btn-primary" onclick="guardarAtajo()">Guardar atajo</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="status-dot"></span>
                JARVIS // CORE V2
            </div>
            <button class="lock-btn" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <div class="quick-actions-bar">
        <div class="quick-actions" id="quick-actions-container"></div>
    </div>
    
    <div id="chat-box">
        <div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>
    </div>

    <div class="input-wrapper">
        <div class="input-area" id="inputArea">
            <textarea id="userInput" rows="1" placeholder="Escribe o habla con Jarvis..."></textarea>
            
            <!-- Indicador de audio integrado estilo Gemini -->
            <div class="box-audio-indicator" id="boxAudioIndicator">
                <div class="gemini-waves">
                    <span></span><span></span><span></span><span></span>
                </div>
                <span id="audioStatusText">Escuchando...</span>
            </div>

            <div class="input-actions">
                <!-- Botón de Micrófono -->
                <button class="mic-btn" id="micBtn" onclick="toggleDictado()" title="Dictar por voz">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" x2="12" y1="19" y2="22"></line>
                    </svg>
                </button>

                <!-- Botón de Enviar -->
                <button class="send-btn" id="sendBtn" onclick="enviarMensaje()" title="Enviar mensaje">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let currentUserId = 'default';
        let isGenerating = false;
        let isRecording = false;
        let historial = [];

        const authModal = document.getElementById('auth-modal');
        const shortcutsModal = document.getElementById('shortcuts-modal');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const inputArea = document.getElementById('inputArea');
        const boxAudioIndicator = document.getElementById('boxAudioIndicator');

        const ATAJOS_POR_DEFECTO = [
            { icon: '📋', label: 'Resumen del día', prompt: '¿Cómo llevo el día? Dime tareas pendientes, eventos y calorías' }
        ];

        function ajustarAlturaInput() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
        }

        userInput.addEventListener('input', ajustarAlturaInput);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (!esMovil) {
                    e.preventDefault();
                    enviarMensaje();
                }
            }
        });

        // --- GESTIÓN DE ATAJOS ---
        function obtenerClaveStorageAtajos() {
            return `jarvis_shortcuts_${currentUserId}`;
        }

        function cargarAtajosUsuario() {
            try {
                const guardados = localStorage.getItem(obtenerClaveStorageAtajos());
                if (guardados) {
                    const parsed = JSON.parse(guardados);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...ATAJOS_POR_DEFECTO];
        }

        function guardarAtajosEnStorage(lista) {
            localStorage.setItem(obtenerClaveStorageAtajos(), JSON.stringify(lista));
            renderizarBarraAtajos();
            renderizarListaModalAtajos();
        }

        function renderizarBarraAtajos() {
            const container = document.getElementById('quick-actions-container');
            const atajos = cargarAtajosUsuario();
            container.innerHTML = '';

            atajos.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.disabled = isGenerating;
                btn.innerHTML = `${item.icon ? item.icon + ' ' : ''}${item.label}`;
                btn.onclick = () => enviarRapido(item.prompt);
                container.appendChild(btn);
            });

            const manageBtn = document.createElement('button');
            manageBtn.className = 'chip-action';
            manageBtn.innerHTML = '<span>＋ Atajo</span>';
            manageBtn.onclick = abrirModalAtajos;
            container.appendChild(manageBtn);
        }

        function abrirModalAtajos() {
            resetFormularioAtajo();
            renderizarListaModalAtajos();
            shortcutsModal.style.display = 'flex';
        }

        function cerrarModalAtajos() {
            shortcutsModal.style.display = 'none';
        }

        function renderizarListaModalAtajos() {
            const listEl = document.getElementById('shortcuts-list');
            const atajos = cargarAtajosUsuario();
            listEl.innerHTML = '';

            atajos.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'shortcut-item';
                row.innerHTML = `
                    <div class="shortcut-info">
                        <div class="shortcut-icon-preview">${item.icon || '⚡'}</div>
                        <div class="shortcut-text-group">
                            <div class="shortcut-title">${item.label}</div>
                            <div class="shortcut-prompt">${item.prompt}</div>
                        </div>
                    </div>
                    <div class="shortcut-item-actions">
                        <button class="mini-btn" onclick="prepararEdicionAtajo(${idx})">Editar</button>
                        <button class="mini-btn delete" onclick="eliminarAtajo(${idx})">Borrar</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function prepararEdicionAtajo(index) {
            const atajos = cargarAtajosUsuario();
            const item = atajos[index];
            if (!item) return;
            document.getElementById('form-shortcut-title').textContent = 'Editar atajo';
            document.getElementById('shortcutIconInput').value = item.icon || '';
            document.getElementById('shortcutLabelInput').value = item.label;
            document.getElementById('shortcutPromptInput').value = item.prompt;
            document.getElementById('shortcutEditIndex').value = String(index);
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
        }

        function resetFormularioAtajo() {
            document.getElementById('form-shortcut-title').textContent = 'Añadir nuevo atajo';
            document.getElementById('shortcutIconInput').value = '';
            document.getElementById('shortcutLabelInput').value = '';
            document.getElementById('shortcutPromptInput').value = '';
            document.getElementById('shortcutEditIndex').value = '-1';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function guardarAtajo() {
            const icon = document.getElementById('shortcutIconInput').value.trim();
            const label = document.getElementById('shortcutLabelInput').value.trim();
            const prompt = document.getElementById('shortcutPromptInput').value.trim();
            const editIdx = parseInt(document.getElementById('shortcutEditIndex').value, 10);

            if (!label || !prompt) return alert('Rellena la etiqueta y el prompt del atajo.');

            const atajos = cargarAtajosUsuario();
            if (editIdx >= 0 && editIdx < atajos.length) {
                atajos[editIdx] = { icon, label, prompt };
            } else {
                atajos.push({ icon, label, prompt });
            }

            guardarAtajosEnStorage(atajos);
            resetFormularioAtajo();
        }

        function eliminarAtajo(index) {
            const atajos = cargarAtajosUsuario();
            atajos.splice(index, 1);
            guardarAtajosEnStorage(atajos);
        }

        function setEstadoGenerando(activo) {
            isGenerating = activo;
            userInput.disabled = activo;
            sendBtn.disabled = activo;
            micBtn.disabled = activo;
            document.querySelectorAll('.chip').forEach(btn => btn.disabled = activo);
        }

        function actualizarEstadoConexion(estado) {
            const dot = document.querySelector('.status-dot');
            if (!dot) return;
            if (estado === 'online') {
                dot.style.backgroundColor = '#22c55e';
                dot.style.boxShadow = '0 0 8px #22c55e';
            } else {
                dot.style.backgroundColor = '#ef4444';
                dot.style.boxShadow = '0 0 8px #ef4444';
            }
        }

        async function initApp() {
            renderizarBarraAtajos();

            if (typeof supabase === 'undefined' || !supabase.createClient) {
                setTimeout(initApp, 300);
                return;
            }

            try {
                const res = await fetch('/api');
                if (!res.ok) throw new Error(`Error HTTP ${res.status} en /api/config`);
                
                const config = await res.json();
                if (!config.supabaseUrl || !config.supabaseAnonKey) {
                    throw new Error("Faltan SUPABASE_URL o SUPABASE_KEY en Vercel.");
                }

                localStorage.setItem('jarvis_supa_config', JSON.stringify(config));
                supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                // Escuchamos cambios de sesión en vivo (cuando vuelve del login de Google)
                supabaseClient.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        currentUserId = session.user.id;
                        if (session.provider_token) {
                            localStorage.setItem('jarvis_google_token', session.provider_token);
                        }
                        authModal.style.display = 'none';
                        renderizarBarraAtajos();
                    } else {
                        authModal.style.display = 'flex';
                    }
                });

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                } else {
                    authModal.style.display = 'flex';
                }
                actualizarEstadoConexion('online');
            } catch (e) {
                console.error("❌ Error inicializando Supabase:", e);
                actualizarEstadoConexion('offline');
            }
        }

        // ¡ESTA LÍNEA ES LA QUE FALTABA EN TU ARCHIVO!
        initApp();

        async function loginGoogle() {
            if (!supabaseClient) {
                await initApp();
            }
            if (!supabaseClient) {
                alert('No se pudo conectar con /api/config. Revisa la consola (F12).');
                return;
            }
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin,
                    scopes: 'https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar',
                    queryParams: {
                        access_type: 'offline',
                        prompt: 'consent'
                    }
                }
            });
        }

        async function logout() {
            try {
                if (supabaseClient) await supabaseClient.auth.signOut();
            } catch (e) {}
            localStorage.removeItem('jarvis_google_token');
            Object.keys(localStorage).forEach(k => {
                if (k.startsWith('sb-')) localStorage.removeItem(k);
            });
            location.reload();
        }

        function formatearTexto(texto) {
            return texto
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function enviarRapido(texto) {
            if (isGenerating) return;
            userInput.value = texto;
            enviarMensaje();
        }

        // --- PROCESAMIENTO INTELIGENTE DE TEXTO (PUNTUACIÓN Y CONTEXTO) ---
        function procesarTextoVoz(texto) {
            if (!texto) return '';
            let limpio = texto.trim();
            // Capitalizar primera letra
            limpio = limpio.charAt(0).toUpperCase() + limpio.slice(1);
            
            // Añadir puntuación final si no la tiene
            if (!/[.?!]$/.test(limpio)) {
                if (/^(cuándo|dónde|cómo|qué|quién|por qué)/i.test(limpio)) {
                    limpio += '?';
                } else {
                    limpio += '.';
                }
            }
            return limpio;
        }

        async function enviarMensaje() {
            if (isGenerating) return;

            // Blindaje: Si supabaseClient por lo que sea sigue null, lo inicializamos de emergencia
            if (!supabaseClient) {
                if (typeof supabase !== 'undefined' && localStorage.getItem('jarvis_supa_config')) {
                    try {
                        const cfg = JSON.parse(localStorage.getItem('jarvis_supa_config'));
                        supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
                    } catch (e) {}
                }
            }

            if (!supabaseClient) {
                authModal.style.display = 'flex';
                alert('La sesión no está inicializada. Inicia sesión con Google.');
                return;
            }

            if (isRecording && recognition) {
                recognition.stop();
                isRecording = false;
            }

            let text = userInput.value.trim();
            if (!text) return;

            text = procesarTextoVoz(text);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                authModal.style.display = 'flex';
                return;
            }

            setEstadoGenerando(true);

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            userInput.value = '';
            textoBaseAntesDeDictar = '';
            ajustarAlturaInput();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const googleToken = session.provider_token || localStorage.getItem('jarvis_google_token') || '';

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                        'X-Google-Token': googleToken
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                if (res.status === 401) {
                    authModal.style.display = 'flex';
                    setEstadoGenerando(false);
                    return;
                }

                const data = await res.json();
                const reply = data.reply || data.error;

                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}</div>`;
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">Error de conexión con el servidor.</div>`;
            } finally {
                setEstadoGenerando(false);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // --- RECONOCIMIENTO DE VOZ CORREGIDO PARA MÓVIL (EVITA BUCLES) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let textoBaseAntesDeDictar = '';

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                textoBaseAntesDeDictar = userInput.value.trim();
                if (textoBaseAntesDeDictar) textoBaseAntesDeDictar += ' ';
                micBtn.classList.add('recording');
                inputArea.classList.add('listening');
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                inputArea.classList.remove('listening');
                ajustarAlturaInput();
                userInput.focus();
            };

            recognition.onerror = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                inputArea.classList.remove('listening');
            };

            recognition.onresult = (event) => {
                let transcriptBuffer = '';
                // Recorremos únicamente el resultado actual para evitar la duplicación en bucle
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcriptBuffer += event.results[i][0].transcript;
                }
                userInput.value = (textoBaseAntesDeDictar + transcriptBuffer).trimStart();
                ajustarAlturaInput();
                userInput.scrollTop = userInput.scrollHeight;
            };
        }

        function toggleDictado() {
            if (isGenerating) return;
            if (!recognition) return alert('Tu navegador no soporta dictado por voz.');

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log("Service Worker registrado con éxito"))
                    .catch((err) => console.log("Error al registrar el Service Worker:", err));
            });
        }
    </script>
</body>
