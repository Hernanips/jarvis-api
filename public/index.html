<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1B1B1B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS // OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #1B1B1B;
            --bg-panel: #222222;
            --bg-card: #262626;
            --bg-input: #242424;
            --border: #333333;
            --text-main: #F1F1F1;
            --text-muted: #9E9E9E;
            --accent: #D71921;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            padding-bottom: 12px;
            padding-left: max(18px, env(safe-area-inset-left, 18px));
            padding-right: max(18px, env(safe-area-inset-right, 18px));
            background: rgba(27, 27, 27, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-main);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(241, 241, 241, 0.6);
            transition: all 0.3s ease;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-top-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-top-btn:hover {
            color: var(--text-main);
            border-color: #555555;
            background: #2E2E2E;
        }
        .icon-top-btn.danger:hover {
            color: var(--accent);
            border-color: rgba(215, 25, 33, 0.5);
        }

        /* BARRA DE ATAJOS */
        .quick-actions-bar {
            border-bottom: 1px solid var(--border);
            background: var(--bg-main);
            flex-shrink: 0;
            width: 100%;
        }

        .quick-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .chip svg {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .chip:hover:not(:disabled) {
            border-color: var(--text-main);
            background: #2F2F2F;
        }
        .chip:hover:not(:disabled) svg { color: var(--text-main); }
        .chip:disabled { opacity: 0.45; cursor: not-allowed; }

        .chip-action {
            background: transparent;
            border: 1px dashed #4A4A4A;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .chip-action:hover { color: var(--text-main); border-color: var(--text-main); background: var(--bg-card); }

        /* CHAT BOX */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #FFFFFF; font-weight: 600; }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* BARRA INFERIOR NOTHING / GEMINI */
        .input-wrapper {
            padding-top: 10px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            padding-left: max(14px, env(safe-area-inset-left, 14px));
            padding-right: max(14px, env(safe-area-inset-right, 14px));
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            width: 100%;
        }

        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 7px 9px 7px 18px;
            position: relative;
            transition: all 0.2s ease;
            min-height: 52px;
        }

        .input-area:focus-within {
            border-color: #555555;
        }

        .input-area.listening {
            background: #202020;
            border-color: var(--text-main);
            align-items: center;
        }

        textarea#userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            line-height: 24px;
            resize: none;
            max-height: 120px;
            height: 24px;
            padding: 0;
            margin: 7px 0;
            overflow-y: hidden;
        }
        textarea#userInput::placeholder {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        textarea#userInput:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Al escuchar, ocultamos el textarea y mostramos las ondas en su lugar exacto */
        .input-area.listening textarea#userInput {
            display: none;
        }

        .waveform-slot {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            height: 38px;
            padding: 0 8px 0 0;
            overflow: hidden;
        }

        .input-area.listening .waveform-slot {
            display: flex;
        }

        /* Todas las barras empiezan en 3px (planas a cero) hasta que hablas */
        .wave-bar {
            flex: 1;
            max-width: 3.5px;
            height: 3px;
            border-radius: 99px;
            background: var(--text-main);
            transition: height 0.07s ease-out, opacity 0.1s ease;
            opacity: 0.35;
        }
        .wave-bar.active {
            opacity: 1;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-circle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }
        .action-circle-btn:hover:not(:disabled) {
            background: #303030;
            color: var(--text-main);
        }
        .action-circle-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Botón Stop cuadrado cuando está grabando */
        .input-area.listening .action-circle-btn {
            background: rgba(215, 25, 33, 0.16);
            color: var(--accent);
        }
        .input-area.listening .action-circle-btn:hover:not(:disabled) {
            background: rgba(215, 25, 33, 0.26);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.04); }
        .send-btn:disabled {
            background: #303030;
            color: #666666;
            cursor: not-allowed;
            transform: none;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27, 27, 27, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .google-btn {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }

        /* LISTA Y REORDENACIÓN DE ATAJOS */
        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 210px;
            overflow-y: auto;
        }
        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 9px 11px;
            border-radius: 10px;
        }
        .shortcut-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .shortcut-icon-preview {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            flex-shrink: 0;
        }
        .shortcut-icon-preview svg {
            width: 16px;
            height: 16px;
        }
        .shortcut-text-group {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .shortcut-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shortcut-prompt {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .shortcut-item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mini-icon-btn {
            background: #2E2E2E;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .mini-icon-btn:hover:not(:disabled) {
            color: var(--text-main);
            border-color: #555555;
        }
        .mini-icon-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }
        .mini-icon-btn.delete:hover {
            color: var(--accent);
            border-color: rgba(215, 25, 33, 0.5);
        }

        /* SELECTOR DE ICONOS ESTILO VERCEL */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-picker-trigger {
            width: 42px;
            height: 40px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.15s;
        }
        .icon-picker-trigger:hover {
            border-color: var(--text-main);
        }
        .icon-picker-trigger svg {
            width: 18px;
            height: 18px;
        }

        .icon-picker-panel {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
        }
        .icon-picker-panel.open {
            display: grid;
        }
        .icon-option-btn {
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-option-btn svg {
            width: 16px;
            height: 16px;
        }
        .icon-option-btn:hover,
        .icon-option-btn.selected {
            color: var(--bg-main);
            background: var(--text-main);
            border-color: var(--text-main);
        }

        .form-input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus { border-color: #666666; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- MODAL DE ACCESO CON GOOGLE -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2>JARVIS // AUTH</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">Inicia sesión con tu cuenta de Google para sincronizar tus tareas y base de datos de forma segura.</p>
            <button class="google-btn" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 11.7c0 1.83.43 3.56 1.18 5.08l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- MODAL DE GESTIÓN DE ATAJOS CON GALERÍA DE ICONOS SVG -->
    <div id="shortcuts-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>ATAJOS RÁPIDOS</h2>
                <button class="btn-secondary" onclick="cerrarModalAtajos()" style="padding: 4px 10px;">✕</button>
            </div>
            <p style="font-size: 12px; color: var(--text-muted);">Reordena o personaliza tus accesos directos.</p>

            <div id="shortcuts-list" class="shortcut-list"></div>

            <hr style="border: none; border-top: 1px solid var(--border);">

            <div class="form-group">
                <label id="form-shortcut-title">Añadir nuevo atajo</label>
                <div class="form-row">
                    <button type="button" class="icon-picker-trigger" id="iconPickerTrigger" onclick="togglePanelIconos()" title="Cambiar icono"></button>
                    <input type="text" id="shortcutLabelInput" class="form-input" style="flex:1;" placeholder="Nombre (ej: Resumen del día)">
                </div>

                <!-- Panel desplegable con librería de iconos SVG estilo Vercel -->
                <div id="iconPickerPanel" class="icon-picker-panel"></div>

                <input type="text" id="shortcutPromptInput" class="form-input" placeholder="Instrucción (ej: ¿Cómo llevo el día?)">
                <input type="hidden" id="shortcutIconKey" value="calendar">
                <input type="hidden" id="shortcutEditIndex" value="-1">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelEditBtn" onclick="resetFormularioAtajo()" style="display: none;">Cancelar</button>
                <button class="btn-primary" onclick="guardarAtajo()">Guardar</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="status-dot"></span>
                JARVIS // OS
            </div>
            <div class="header-actions">
                <!-- Papelera SVG -->
                <button class="icon-top-btn danger" onclick="limpiarChatLocal()" title="Limpiar chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"></path>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
                <!-- Puerta con flecha hacia afuera SVG (Salir) -->
                <button class="icon-top-btn" onclick="logout()" title="Cerrar sesión">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="quick-actions-bar">
        <div class="quick-actions" id="quick-actions-container"></div>
    </div>
    
    <div id="chat-box"></div>

    <div class="input-wrapper">
        <div class="input-area" id="inputArea">
            
            <textarea id="userInput" rows="1" placeholder="Mensaje a Jarvis..."></textarea>

            <!-- Hueco exacto del texto ocupado por las ondas (empiezan a 0 en silencio) -->
            <div class="waveform-slot" id="waveformBars"></div>

            <div class="input-actions">
                <!-- Botón Micro / Stop cuadrado -->
                <button class="action-circle-btn" id="micBtn" onclick="toggleDictado()" title="Voz">
                    <svg id="micIconSvg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" x2="12" y1="19" y2="22"></line>
                    </svg>
                </button>

                <!-- Botón Enviar -->
                <button class="send-btn" id="sendBtn" onclick="enviarMensaje()" title="Enviar mensaje">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let currentSession = null;
        let currentUserId = 'default';
        let isGenerating = false;
        let historial = [];

        // Paquete integrado de 20 iconos vectoriales SVG estilo Vercel/Lucide
        const ICON_PACK = {
            calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
            bolt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
            flame: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
            utensils: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`,
            dumbbell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>`,
            bike: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>`,
            book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`,
            clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
            scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>`,
            note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
            list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
            sparkles: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>`,
            sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
            moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
            cart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>`,
            bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
            heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`
        };

        function obtenerSvgIcono(iconKeyOrEmoji) {
            if (ICON_PACK[iconKeyOrEmoji]) return ICON_PACK[iconKeyOrEmoji];
            return ICON_PACK.calendar;
        }

        // Capturar tokens OAuth de la URL al volver de Google
        let tokensOAuthUrl = null;
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const pToken = params.get('provider_token');
            const aToken = params.get('access_token');
            const rToken = params.get('refresh_token');
            if (pToken) localStorage.setItem('jarvis_google_token', pToken);
            if (aToken && rToken) {
                tokensOAuthUrl = { access_token: aToken, refresh_token: rToken };
            }
        }

        if ('caches' in window) {
            caches.keys().then(keys => {
                keys.forEach(k => {
                    if (k !== 'jarvis-shell-v5') caches.delete(k);
                });
            });
        }

        const authModal = document.getElementById('auth-modal');
        const shortcutsModal = document.getElementById('shortcuts-modal');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const micIconSvg = document.getElementById('micIconSvg');
        const inputArea = document.getElementById('inputArea');
        const waveformBarsContainer = document.getElementById('waveformBars');

        // Generar las 32 barras que empiezan planas a cero
        const NUM_WAVE_BARS = 32;
        const waveBarElements = [];
        for (let i = 0; i < NUM_WAVE_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            waveformBarsContainer.appendChild(bar);
            waveBarElements.push(bar);
        }

        const ATAJOS_POR_DEFECTO = [
            { icon: 'calendar', label: 'Resumen del día', prompt: '¿Cómo llevo el día? Dime tareas pendientes, eventos y calorías.' }
        ];

        function ajustarAlturaInput() {
            if (!userInput.value) {
                userInput.style.height = '24px';
                userInput.style.overflowY = 'hidden';
                return;
            }
            userInput.style.height = '24px';
            const sh = userInput.scrollHeight;
            userInput.style.height = Math.min(sh, 120) + 'px';
            userInput.style.overflowY = sh > 120 ? 'auto' : 'hidden';
        }

        userInput.addEventListener('input', ajustarAlturaInput);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (!esMovil) {
                    e.preventDefault();
                    enviarMensaje();
                }
            }
        });

        // =========================================================================
        // 1. PERSISTENCIA LOCAL DEL CHAT
        // =========================================================================
        function obtenerClaveChatLocal() {
            return `jarvis_chat_history_${currentUserId}`;
        }

        function renderizarChatDesdeStorage() {
            chatBox.innerHTML = '';
            try {
                const guardado = localStorage.getItem(obtenerClaveChatLocal());
                if (guardado) {
                    const mensajesGuardados = JSON.parse(guardado);
                    if (Array.isArray(mensajesGuardados) && mensajesGuardados.length > 0) {
                        historial = [];
                        mensajesGuardados.forEach(m => {
                            const div = document.createElement('div');
                            div.className = `message ${m.sender === 'user' ? 'user' : 'assistant'}`;
                            div.innerHTML = m.sender === 'user' ? m.text : formatearTexto(m.text);
                            chatBox.appendChild(div);

                            historial.push({
                                role: m.sender === 'user' ? 'user' : 'model',
                                parts: [{ text: m.text }]
                            });
                        });
                        if (historial.length > 10) historial = historial.slice(-10);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        return;
                    }
                }
            } catch (e) {}

            chatBox.innerHTML = `<div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>`;
        }

        function guardarMensajeEnChatLocal(sender, text) {
            try {
                const clave = obtenerClaveChatLocal();
                const actual = JSON.parse(localStorage.getItem(clave) || '[]');
                actual.push({ sender, text, ts: Date.now() });
                localStorage.setItem(clave, JSON.stringify(actual.slice(-30)));
            } catch (e) {}
        }

        function limpiarChatLocal() {
            localStorage.removeItem(obtenerClaveChatLocal());
            historial = [];
            chatBox.innerHTML = `<div class="message assistant">Memoria de conversación limpiada. ¿Qué gestionamos ahora?</div>`;
        }

        // =========================================================================
        // 2. GESTIÓN DE ATAJOS + SELECTOR DE ICONOS SVG + REORDENAR
        // =========================================================================
        function obtenerClaveStorageAtajos() {
            return `jarvis_shortcuts_${currentUserId}`;
        }

        function cargarAtajosUsuario() {
            try {
                const guardados = localStorage.getItem(obtenerClaveStorageAtajos());
                if (guardados) {
                    const parsed = JSON.parse(guardados);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...ATAJOS_POR_DEFECTO];
        }

        function guardarAtajosEnStorage(lista) {
            localStorage.setItem(obtenerClaveStorageAtajos(), JSON.stringify(lista));
            renderizarBarraAtajos();
            renderizarListaModalAtajos();
        }

        function renderizarPanelSelectorIconos() {
            const panel = document.getElementById('iconPickerPanel');
            const seleccionado = document.getElementById('shortcutIconKey').value || 'calendar';
            const trigger = document.getElementById('iconPickerTrigger');
            trigger.innerHTML = obtenerSvgIcono(seleccionado);

            panel.innerHTML = '';
            Object.keys(ICON_PACK).forEach(key => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `icon-option-btn ${key === seleccionado ? 'selected' : ''}`;
                btn.innerHTML = ICON_PACK[key];
                btn.onclick = () => seleccionarIconoAtajo(key);
                panel.appendChild(btn);
            });
        }

        function togglePanelIconos() {
            const panel = document.getElementById('iconPickerPanel');
            panel.classList.toggle('open');
        }

        function seleccionarIconoAtajo(key) {
            document.getElementById('shortcutIconKey').value = key;
            document.getElementById('iconPickerPanel').classList.remove('open');
            renderizarPanelSelectorIconos();
        }

        function renderizarBarraAtajos() {
            const container = document.getElementById('quick-actions-container');
            const atajos = cargarAtajosUsuario();
            container.innerHTML = '';

            atajos.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.disabled = isGenerating;
                btn.innerHTML = `${obtenerSvgIcono(item.icon)}<span>${item.label}</span>`;
                btn.onclick = () => enviarRapido(item.prompt);
                container.appendChild(btn);
            });

            const manageBtn = document.createElement('button');
            manageBtn.className = 'chip-action';
            manageBtn.innerHTML = '<span>＋ Atajo</span>';
            manageBtn.onclick = abrirModalAtajos;
            container.appendChild(manageBtn);
        }

        function abrirModalAtajos() {
            resetFormularioAtajo();
            renderizarListaModalAtajos();
            shortcutsModal.style.display = 'flex';
        }

        function cerrarModalAtajos() {
            shortcutsModal.style.display = 'none';
        }

        function moverAtajo(index, direccion) {
            const atajos = cargarAtajosUsuario();
            const nuevoIndex = index + direccion;
            if (nuevoIndex < 0 || nuevoIndex >= atajos.length) return;
            const temp = atajos[index];
            atajos[index] = atajos[nuevoIndex];
            atajos[nuevoIndex] = temp;
            guardarAtajosEnStorage(atajos);
        }

        function renderizarListaModalAtajos() {
            const listEl = document.getElementById('shortcuts-list');
            const atajos = cargarAtajosUsuario();
            listEl.innerHTML = '';

            atajos.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'shortcut-item';
                row.innerHTML = `
                    <div class="shortcut-info">
                        <div class="shortcut-icon-preview">${obtenerSvgIcono(item.icon)}</div>
                        <div class="shortcut-text-group">
                            <div class="shortcut-title">${item.label}</div>
                            <div class="shortcut-prompt">${item.prompt}</div>
                        </div>
                    </div>
                    <div class="shortcut-item-actions">
                        <button class="mini-icon-btn" onclick="moverAtajo(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Subir">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <button class="mini-icon-btn" onclick="moverAtajo(${idx}, 1)" ${idx === atajos.length - 1 ? 'disabled' : ''} title="Bajar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <button class="mini-icon-btn" onclick="prepararEdicionAtajo(${idx})" title="Editar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                        <button class="mini-icon-btn delete" onclick="eliminarAtajo(${idx})" title="Borrar">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function prepararEdicionAtajo(index) {
            const atajos = cargarAtajosUsuario();
            const item = atajos[index];
            if (!item) return;
            document.getElementById('form-shortcut-title').textContent = 'Editar atajo';
            document.getElementById('shortcutIconKey').value = ICON_PACK[item.icon] ? item.icon : 'calendar';
            document.getElementById('shortcutLabelInput').value = item.label;
            document.getElementById('shortcutPromptInput').value = item.prompt;
            document.getElementById('shortcutEditIndex').value = String(index);
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            renderizarPanelSelectorIconos();
        }

        function resetFormularioAtajo() {
            document.getElementById('form-shortcut-title').textContent = 'Añadir nuevo atajo';
            document.getElementById('shortcutIconKey').value = 'calendar';
            document.getElementById('shortcutLabelInput').value = '';
            document.getElementById('shortcutPromptInput').value = '';
            document.getElementById('shortcutEditIndex').value = '-1';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('iconPickerPanel').classList.remove('open');
            renderizarPanelSelectorIconos();
        }

        function guardarAtajo() {
            const icon = document.getElementById('shortcutIconKey').value || 'calendar';
            const label = document.getElementById('shortcutLabelInput').value.trim();
            const prompt = document.getElementById('shortcutPromptInput').value.trim();
            const editIdx = parseInt(document.getElementById('shortcutEditIndex').value, 10);

            if (!label || !prompt) return alert('Rellena el nombre y la instrucción del atajo.');

            const atajos = cargarAtajosUsuario();
            if (editIdx >= 0 && editIdx < atajos.length) {
                atajos[editIdx] = { icon, label, prompt };
            } else {
                atajos.push({ icon, label, prompt });
            }

            guardarAtajosEnStorage(atajos);
            resetFormularioAtajo();
        }

        function eliminarAtajo(index) {
            const atajos = cargarAtajosUsuario();
            atajos.splice(index, 1);
            guardarAtajosEnStorage(atajos);
        }

        function setEstadoGenerando(activo) {
            isGenerating = activo;
            userInput.disabled = activo;
            sendBtn.disabled = activo;
            micBtn.disabled = activo;
            document.querySelectorAll('.chip').forEach(btn => btn.disabled = activo);
        }

        function actualizarEstadoConexion(estado) {
            const dot = document.querySelector('.status-dot');
            if (!dot) return;
            if (estado === 'online') {
                dot.style.backgroundColor = '#F1F1F1';
                dot.style.boxShadow = '0 0 6px rgba(241, 241, 241, 0.6)';
            } else {
                dot.style.backgroundColor = '#D71921';
                dot.style.boxShadow = '0 0 8px #D71921';
            }
        }

        // =========================================================================
        // 3. INICIALIZACIÓN Y AUTH SUPABASE
        // =========================================================================
        function crearClienteSupabase(url, key) {
            if (supabaseClient) return supabaseClient;
            supabaseClient = supabase.createClient(url, key, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    lock: async (_name, _acquireTimeout, fn) => await fn()
                }
            });

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                currentSession = session || null;
                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                    renderizarChatDesdeStorage();
                }
            });

            return supabaseClient;
        }

        async function initApp() {
            renderizarBarraAtajos();
            renderizarChatDesdeStorage();
            renderizarPanelSelectorIconos();

            if (typeof supabase === 'undefined' || !supabase.createClient) {
                setTimeout(initApp, 300);
                return;
            }

            try {
                const res = await fetch('/api');
                if (!res.ok) throw new Error(`Error HTTP ${res.status} en /api`);
                
                const config = await res.json();
                if (!config.supabaseUrl || !config.supabaseAnonKey) {
                    throw new Error("Faltan SUPABASE_URL o SUPABASE_KEY en Vercel.");
                }

                localStorage.setItem('jarvis_supa_config', JSON.stringify(config));
                crearClienteSupabase(config.supabaseUrl, config.supabaseAnonKey);

                if (tokensOAuthUrl) {
                    await supabaseClient.auth.setSession(tokensOAuthUrl);
                    tokensOAuthUrl = null;
                    window.history.replaceState(null, '', window.location.pathname);
                }

                const { data: { session } } = await supabaseClient.auth.getSession();
                currentSession = session || null;

                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                    renderizarChatDesdeStorage();
                } else {
                    authModal.style.display = 'flex';
                }
                actualizarEstadoConexion('online');
            } catch (e) {
                console.error("❌ Error inicializando Supabase:", e);
                actualizarEstadoConexion('offline');
                authModal.style.display = 'flex';
            }
        }

        initApp();

        async function loginGoogle() {
            try {
                if (!supabaseClient) await initApp();
                if (!supabaseClient) return;
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin,
                        scopes: 'https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar',
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent'
                        }
                    }
                });
                if (error) alert('Error al conectar con Google: ' + error.message);
            } catch (err) {
                alert('Error en login: ' + err.message);
            }
        }

        async function logout() {
            currentSession = null;
            localStorage.removeItem('jarvis_google_token');
            Object.keys(localStorage).forEach(k => {
                if (k.startsWith('sb-')) localStorage.removeItem(k);
            });

            if (supabaseClient) {
                try {
                    await Promise.race([
                        supabaseClient.auth.signOut(),
                        new Promise(resolve => setTimeout(resolve, 800))
                    ]);
                } catch (e) {}
            }
            window.location.href = window.location.origin;
        }

        // =========================================================================
        // 4. MOTOR DE PUNTUACIÓN Y FORMATO DE TRANSCRIPCIÓN (ESPAÑOL)
        // =========================================================================
        function procesarTextoVoz(texto) {
            if (!texto) return '';
            let t = texto.replace(/\s+/g, ' ').trim();
            if (!t) return '';

            t = t
                .replace(/\b(punto y aparte|punto y seguido)\b/gi, '.')
                .replace(/\bdos puntos\b/gi, ':')
                .replace(/\bpunto y coma\b/gi, ';')
                .replace(/\babrir interrogaci[oó]n\b/gi, '¿')
                .replace(/\bcerrar interrogaci[oó]n\b/gi, '?');

            t = t.replace(/^(oye jarvis|hola jarvis|jarvis|vale a ver|a ver|vale|bueno|mira|oye|por cierto|escucha)\s+(?=[a-záéíóúñ])/i, (match) => {
                return match.trim() + ', ';
            });

            const conectoresConComa = [
                'pero', 'aunque', 'sin embargo', 'no obstante', 'además',
                'por cierto', 'es decir', 'o sea', 'por tanto', 'por lo tanto',
                'así que', 'entonces', 'de hecho', 'en cambio', 'mientras que', 'ya que'
            ];
            conectoresConComa.forEach(conector => {
                const regex = new RegExp(`([^.,;¿?¡!])\\s+\\b(${conector})\\b`, 'gi');
                t = t.replace(regex, '$1, $2');
            });

            t = t.replace(/\s+([.,;:?!])/g, '$1').replace(/,+/g, ',');

            let oraciones = t.split(/(?<=[.?!])\s+/);
            oraciones = oraciones.map(oracion => {
                let s = oracion.trim();
                if (!s) return '';

                s = s.charAt(0).toUpperCase() + s.slice(1);

                const patronPreguntaInicio = /^(¿)?(qué|que|cuándo|cuando|dónde|donde|cómo|como|quién|quien|cuánto|cuanto|cuántos|cuantas|cuál|cual|por qué|por que|me puedes decir|dime qué|dime cuánto|sabes si|tengo algún|tengo alguna|hay algún|hay alguna)\b/i;
                const patronPreguntaMitad = /,\s*(y\s+)?(qué|cuándo|dónde|cómo|quién|cuánto|cuántas|cuál|por qué|tengo algún|hay algún)\b/i;

                const tieneCierre = /[.?!]$/.test(s);

                if (patronPreguntaInicio.test(s)) {
                    if (!s.startsWith('¿')) s = '¿' + s.charAt(0).toUpperCase() + s.slice(1);
                    s = s.replace(/[.!]+$/, '') + (s.endsWith('?') ? '' : '?');
                } else if (patronPreguntaMitad.test(s)) {
                    s = s.replace(/,\s*((?:y\s+)?(?:qué|cuándo|dónde|cómo|quién|cuánto|cuántas|cuál|por qué|tengo algún|hay algún)\b.*)/i, (m, sub) => {
                        const subLimpio = sub.replace(/[.?!]+$/, '');
                        return `, ¿${subLimpio}?`;
                    });
                } else if (!tieneCierre) {
                    s += '.';
                }

                return s;
            });

            return oraciones.join(' ');
        }

        function formatearTexto(texto) {
            return String(texto || '')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function enviarRapido(texto) {
            if (isGenerating) return;
            userInput.value = texto;
            enviarMensaje();
        }

        // =========================================================================
        // 5. RECONOCIMIENTO DE VOZ SIN CONFLICTO DE HARDWARE + ONDAS DESDE CERO
        // =========================================================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;
        let shouldKeepListening = false;
        let textoBaseAntesDeSesion = '';
        let acumuladoEnEstaSesion = '';
        let decayWaveTimeout = null;

        function cambiarIconoBotonMicro(grabando) {
            if (grabando) {
                micIconSvg.innerHTML = `<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"></rect>`;
            } else {
                micIconSvg.innerHTML = `
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" x2="12" y1="19" y2="22"></line>
                `;
            }
        }

        // Mantiene todas las barras a 0 (3px) cuando estás en silencio
        function ponerOndasACero() {
            clearTimeout(decayWaveTimeout);
            waveBarElements.forEach(b => {
                b.style.height = '3px';
                b.classList.remove('active');
            });
        }

        // Pulsa las barras proporcionalmente a las palabras que estás diciendo y vuelve a 0 al callarte
        function impulsarOndasPorVoz(intensidad = 1) {
            if (!isRecording) return;
            clearTimeout(decayWaveTimeout);

            const centro = NUM_WAVE_BARS / 2;
            for (let i = 0; i < NUM_WAVE_BARS; i++) {
                const dist = Math.abs(i - centro) / centro;
                const envolvente = Math.max(0.15, 1 - dist * 0.85);
                const aleatorio = 0.35 + Math.random() * 0.65;
                const altura = Math.max(4, Math.min(32, Math.round(32 * envolvente * aleatorio * intensidad)));
                waveBarElements[i].style.height = `${altura}px`;
                waveBarElements[i].classList.add('active');
            }

            // Si dejas de hablar durante 180ms, las barras vuelven suavemente a cero
            decayWaveTimeout = setTimeout(() => {
                ponerOndasACero();
            }, 180);
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onsoundstart = () => {
                impulsarOndasPorVoz(0.6);
            };

            recognition.onsoundend = () => {
                ponerOndasACero();
            };

            recognition.onresult = (event) => {
                impulsarOndasPorVoz(1);

                let bloqueActual = '';
                for (let i = 0; i < event.results.length; i++) {
                    bloqueActual += event.results[i][0].transcript;
                    if (event.results[i].isFinal && i < event.results.length - 1) {
                        bloqueActual = bloqueActual.trim() + ', ';
                    }
                }

                acumuladoEnEstaSesion = bloqueActual.trim();
                userInput.value = (textoBaseAntesDeSesion + acumuladoEnEstaSesion).replace(/\s+/g, ' ').trimStart();
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    ponerOndasACero();
                    return;
                }
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    detenerGrabacionYVolcarTexto();
                }
            };

            recognition.onend = () => {
                ponerOndasACero();
                // Si el navegador cortó por silencio pero tú no has parado ni enviado, engancha lo dicho y sigue escuchando
                if (shouldKeepListening && isRecording) {
                    if (acumuladoEnEstaSesion) {
                        textoBaseAntesDeSesion = (textoBaseAntesDeSesion + acumuladoEnEstaSesion).trim();
                        if (!/[.,;?!]$/.test(textoBaseAntesDeSesion)) {
                            textoBaseAntesDeSesion += ', ';
                        } else {
                            textoBaseAntesDeSesion += ' ';
                        }
                        acumuladoEnEstaSesion = '';
                        userInput.value = textoBaseAntesDeSesion;
                    }
                    setTimeout(() => {
                        if (shouldKeepListening && isRecording) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 40);
                }
            };
        }

        function iniciarGrabacion() {
            if (isGenerating) return;
            if (!recognition) return alert('Tu navegador no soporta dictado por voz.');

            // Conservamos lo que ya hubiera en la caja de texto para continuar escribiendo a partir de ahí
            textoBaseAntesDeSesion = userInput.value.trim();
            if (textoBaseAntesDeSesion) {
                textoBaseAntesDeSesion += ' ';
            }
            acumuladoEnEstaSesion = '';

            isRecording = true;
            shouldKeepListening = true;
            ponerOndasACero();
            inputArea.classList.add('listening');
            cambiarIconoBotonMicro(true);

            try {
                recognition.start();
            } catch (e) {
                try { recognition.stop(); } catch (err) {}
            }
        }

        function detenerGrabacionYVolcarTexto() {
            shouldKeepListening = false;
            isRecording = false;
            ponerOndasACero();

            try { if (recognition) recognition.stop(); } catch (e) {}

            inputArea.classList.remove('listening');
            cambiarIconoBotonMicro(false);

            const textoBruto = (userInput.value || (textoBaseAntesDeSesion + acumuladoEnEstaSesion)).trim();
            if (textoBruto) {
                userInput.value = procesarTextoVoz(textoBruto);
            }
            textoBaseAntesDeSesion = userInput.value ? userInput.value + ' ' : '';
            acumuladoEnEstaSesion = '';

            ajustarAlturaInput();
            userInput.focus();
        }

        function toggleDictado() {
            if (isGenerating) return;
            if (isRecording) {
                detenerGrabacionYVolcarTexto();
            } else {
                iniciarGrabacion();
            }
        }

        // =========================================================================
        // 6. ENVÍO DE MENSAJES
        // =========================================================================
        async function enviarMensaje() {
            if (isGenerating) return;

            if (isRecording) {
                shouldKeepListening = false;
                isRecording = false;
                ponerOndasACero();
                try { if (recognition) recognition.stop(); } catch (e) {}
                inputArea.classList.remove('listening');
                cambiarIconoBotonMicro(false);
                // Damos 150ms para que el último evento onresult de Android termine de llegar
                await new Promise(r => setTimeout(r, 150));
            }

            let rawText = (userInput.value || (textoBaseAntesDeSesion + acumuladoEnEstaSesion)).trim();
            if (!rawText) return;

            let text = procesarTextoVoz(rawText);

            if (!supabaseClient) {
                await initApp();
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            const sesionActiva = session || currentSession;

            if (!sesionActiva) {
                authModal.style.display = 'flex';
                return;
            }

            setEstadoGenerando(true);

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            guardarMensajeEnChatLocal('user', text);

            userInput.value = '';
            textoBaseAntesDeSesion = '';
            acumuladoEnEstaSesion = '';
            ajustarAlturaInput();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const googleToken = sesionActiva.provider_token || localStorage.getItem('jarvis_google_token') || '';

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`,
                        'X-Google-Token': googleToken
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                const data = await res.json().catch(() => ({}));

                if (res.status === 401) {
                    chatBox.innerHTML += `<div class="message assistant" style="color: var(--accent);">${data.error || 'Sesión expirada. Pulsa en Salir y vuelve a entrar.'}</div>`;
                    authModal.style.display = 'flex';
                    setEstadoGenerando(false);
                    return;
                }

                const reply = data.reply || data.error || 'Sin respuesta del servidor.';
                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}</div>`;
                guardarMensajeEnChatLocal('assistant', reply);
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: var(--accent);">Error de conexión: ${err.message}</div>`;
            } finally {
                setEstadoGenerando(false);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => reg.update())
                    .catch((err) => console.log("Error al registrar el Service Worker:", err));
            });
        }
    </script>
