<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS // OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #121215;
            --bg-card: #18181b;
            --bg-input: #1e1e24;
            --border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
            --gemini-blue: #60a5fa;
            --gemini-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            padding-bottom: 12px;
            padding-left: max(18px, env(safe-area-inset-left, 18px));
            padding-right: max(18px, env(safe-area-inset-right, 18px));
            background: rgba(12, 12, 15, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            transition: all 0.3s ease;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-top-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .icon-top-btn:hover { color: var(--text-main); border-color: #52525b; }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .lock-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        /* BARRA DE ATAJOS */
        .quick-actions-bar {
            border-bottom: 1px solid var(--border);
            background: rgba(9, 9, 11, 0.95);
            flex-shrink: 0;
            width: 100%;
        }

        .quick-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .chip:hover:not(:disabled) { color: var(--text-main); border-color: #52525b; background: #27272a; }
        .chip:disabled { opacity: 0.45; cursor: not-allowed; }

        .chip-action {
            background: transparent;
            border: 1px dashed #3f3f46;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .chip-action:hover { color: var(--text-main); border-color: var(--text-muted); background: var(--bg-card); }

        /* CHAT BOX */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #fff; font-weight: 600; }

        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ZONA INFERIOR ESTILO GEMINI */
        .input-wrapper {
            padding-top: 10px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            padding-left: max(14px, env(safe-area-inset-left, 14px));
            padding-right: max(14px, env(safe-area-inset-right, 14px));
            background: var(--bg-main);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            width: 100%;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 10px 12px 10px 18px;
            position: relative;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-area:focus-within {
            border-color: #52525b;
        }

        /* Estado grabando estilo Gemini con borde brillante */
        .input-area.listening {
            background: #14141d;
            border-color: rgba(96, 165, 250, 0.55);
            box-shadow: 0 0 24px rgba(96, 165, 250, 0.14), inset 0 0 12px rgba(192, 132, 252, 0.06);
        }

        .input-area.paused {
            border-color: #f59e0b;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.12);
        }

        .input-main-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
        }

        textarea#userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.45;
            resize: none;
            max-height: 130px;
            min-height: 24px;
            padding: 5px 0;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        textarea#userInput::placeholder { color: #71717a; }
        textarea#userInput:disabled { opacity: 0.5; cursor: not-allowed; }

        /* PANEL DE ONDAS DINÁMICAS A PANTALLA COMPLETA DE LA BARRA */
        .voice-visualizer-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 4px 4px 2px 0;
        }

        .input-area.listening .voice-visualizer-bar,
        .input-area.paused .voice-visualizer-bar {
            display: flex;
        }

        .live-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: var(--gemini-blue);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .input-area.paused .live-status-pill {
            color: #f59e0b;
        }

        .pulse-rec-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gemini-blue);
            box-shadow: 0 0 8px var(--gemini-blue);
            animation: recPulse 1.2s infinite;
        }

        .input-area.paused .pulse-rec-dot {
            background: #f59e0b;
            box-shadow: none;
            animation: none;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Contenedor de las 28 barras reactivas a la voz */
        .waveform-bars {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 28px;
            overflow: hidden;
        }

        .wave-bar {
            width: 3px;
            height: 4px;
            border-radius: 99px;
            background: linear-gradient(180deg, var(--gemini-blue), var(--gemini-purple));
            transition: height 0.06s ease-out;
            opacity: 0.85;
        }

        .input-area.paused .wave-bar {
            background: #52525b;
            height: 4px !important;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        /* BOTONES REDONDOS DE LA BARRA INFERIOR */
        .action-circle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            flex-shrink: 0;
        }
        .action-circle-btn:hover:not(:disabled) {
            background: #27272a;
            color: var(--text-main);
        }
        .action-circle-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Botón Cancelar voz (X) */
        .cancel-voice-btn {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }
        .cancel-voice-btn:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.22);
            color: #fca5a5;
        }

        /* Botón Pausar/Reanudar voz */
        .pause-voice-btn {
            display: none;
            background: rgba(96, 165, 250, 0.14);
            color: var(--gemini-blue);
        }
        .pause-voice-btn:hover:not(:disabled) {
            background: rgba(96, 165, 250, 0.25);
            color: #93c5fd;
        }

        .input-area.listening .cancel-voice-btn,
        .input-area.paused .cancel-voice-btn,
        .input-area.listening .pause-voice-btn,
        .input-area.paused .pause-voice-btn {
            display: flex;
        }

        .input-area.listening .mic-start-btn,
        .input-area.paused .mic-start-btn {
            display: none;
        }

        /* Botón de Enviar */
        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }
        .input-area.listening .send-btn {
            background: linear-gradient(135deg, var(--gemini-blue), var(--gemini-purple));
            color: #09090b;
        }
        .send-btn:hover:not(:disabled) { opacity: 0.92; transform: scale(1.04); }
        .send-btn:disabled {
            background: #27272a;
            color: #52525b;
            cursor: not-allowed;
            transform: none;
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .google-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }
        .google-btn:hover { opacity: 0.9; }

        /* EDITOR DE ATAJOS */
        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .shortcut-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
        }
        .shortcut-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .shortcut-icon-preview {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        .shortcut-text-group {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .shortcut-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shortcut-prompt {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .shortcut-item-actions {
            display: flex;
            gap: 6px;
        }
        .mini-btn {
            background: #27272a;
            border: none;
            color: var(--text-main);
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .mini-btn.delete { color: #f87171; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }
        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 8px;
        }
        .form-input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus { border-color: #52525b; }
        .icon-input {
            width: 56px;
            text-align: center;
            font-size: 18px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- MODAL DE ACCESO CON GOOGLE -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h2>🔒 JARVIS // AUTH</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">Inicia sesión con tu cuenta de Google para sincronizar tus tareas y base de datos de forma segura.</p>
            <button class="google-btn" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 11.7c0 1.83.43 3.56 1.18 5.08l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Continuar con Google
            </button>
        </div>
    </div>

    <!-- MODAL DE GESTIÓN DE ATAJOS -->
    <div id="shortcuts-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>⚡ ATAJOS RÁPIDOS</h2>
                <button class="btn-secondary" onclick="cerrarModalAtajos()" style="padding: 4px 10px;">✕</button>
            </div>
            <p style="font-size: 12.5px; color: var(--text-muted);">Personaliza tus botones de acceso rápido.</p>

            <div id="shortcuts-list" class="shortcut-list"></div>

            <hr style="border: none; border-top: 1px solid var(--border);">

            <div class="form-group">
                <label id="form-shortcut-title">Añadir nuevo atajo</label>
                <div class="form-row">
                    <input type="text" id="shortcutIconInput" class="form-input icon-input" placeholder="📋" maxlength="4">
                    <input type="text" id="shortcutLabelInput" class="form-input" style="flex:1;" placeholder="Etiqueta del botón (ej: Resumen del día)">
                </div>
                <input type="text" id="shortcutPromptInput" class="form-input" placeholder="Prompt a enviar (ej: ¿Cómo llevo el día?)">
                <input type="hidden" id="shortcutEditIndex" value="-1">
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" id="cancelEditBtn" onclick="resetFormularioAtajo()" style="display: none;">Cancelar</button>
                <button class="btn-primary" onclick="guardarAtajo()">Guardar atajo</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="status-dot"></span>
                JARVIS // OS
            </div>
            <div class="header-actions">
                <button class="icon-top-btn" onclick="limpiarChatLocal()" title="Limpiar conversación">
                    🗑️ Limpiar
                </button>
                <button class="lock-btn" onclick="logout()">Salir</button>
            </div>
        </div>
    </header>

    <div class="quick-actions-bar">
        <div class="quick-actions" id="quick-actions-container"></div>
    </div>
    
    <div id="chat-box"></div>

    <div class="input-wrapper">
        <div class="input-area" id="inputArea">
            
            <!-- BARRA SUPERIOR DE ONDAS EN VIVO (VISIBLE AL HABLAR) -->
            <div class="voice-visualizer-bar" id="voiceVisualizerBar">
                <div class="live-status-pill">
                    <span class="pulse-rec-dot"></span>
                    <span id="audioStatusText">ESCUCHANDO</span>
                </div>
                <div class="waveform-bars" id="waveformBars"></div>
            </div>

            <!-- FILA PRINCIPAL DE TEXTO Y CONTROLES -->
            <div class="input-main-row">
                <textarea id="userInput" rows="1" placeholder="Escribe o pulsa el micro para hablar con Jarvis..."></textarea>

                <div class="input-actions">
                    <!-- 1. Botón Cancelar Grabación (X) -->
                    <button class="action-circle-btn cancel-voice-btn" id="cancelVoiceBtn" onclick="cancelarDictado()" title="Cancelar dictado">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>

                    <!-- 2. Botón Pausar / Reanudar Grabación -->
                    <button class="action-circle-btn pause-voice-btn" id="pauseVoiceBtn" onclick="pausarReanudarDictado()" title="Pausar o reanudar voz">
                        <svg id="pauseIconSvg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                        </svg>
                    </button>

                    <!-- 3. Botón Iniciar Micrófono -->
                    <button class="action-circle-btn mic-start-btn" id="micBtn" onclick="iniciarDictadoContinuo()" title="Modo voz continuo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" x2="12" y1="19" y2="22"></line>
                        </svg>
                    </button>

                    <!-- 4. Botón Enviar (Funciona directo incluso estando el micro abierto) -->
                    <button class="send-btn" id="sendBtn" onclick="enviarMensaje()" title="Enviar mensaje">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let currentSession = null;
        let currentUserId = 'default';
        let isGenerating = false;
        let historial = [];

        // Capturar tokens OAuth de la URL al volver de Google
        let tokensOAuthUrl = null;
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            const params = new URLSearchParams(window.location.hash.substring(1));
            const pToken = params.get('provider_token');
            const aToken = params.get('access_token');
            const rToken = params.get('refresh_token');
            if (pToken) localStorage.setItem('jarvis_google_token', pToken);
            if (aToken && rToken) {
                tokensOAuthUrl = { access_token: aToken, refresh_token: rToken };
            }
        }

        if ('caches' in window) {
            caches.keys().then(keys => {
                keys.forEach(k => {
                    if (k !== 'jarvis-shell-v5') caches.delete(k);
                });
            });
        }

        const authModal = document.getElementById('auth-modal');
        const shortcutsModal = document.getElementById('shortcuts-modal');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const inputArea = document.getElementById('inputArea');
        const audioStatusText = document.getElementById('audioStatusText');
        const pauseIconSvg = document.getElementById('pauseIconSvg');
        const waveformBarsContainer = document.getElementById('waveformBars');

        // Generar las 28 barras del visualizador de ondas estilo Gemini
        const NUM_WAVE_BARS = 28;
        const waveBarElements = [];
        for (let i = 0; i < NUM_WAVE_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            waveformBarsContainer.appendChild(bar);
            waveBarElements.push(bar);
        }

        const ATAJOS_POR_DEFECTO = [
            { icon: '📋', label: 'Resumen del día', prompt: '¿Cómo llevo el día? Dime tareas pendientes, eventos y calorías.' }
        ];

        function ajustarAlturaInput() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 130) + 'px';
        }

        userInput.addEventListener('input', ajustarAlturaInput);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (!esMovil) {
                    e.preventDefault();
                    enviarMensaje();
                }
            }
        });

        // =========================================================================
        // 1. PERSISTENCIA LOCAL DEL CHAT (COSTE 0 EN SUPABASE + BOTÓN DE BORRADO)
        // =========================================================================
        function obtenerClaveChatLocal() {
            return `jarvis_chat_history_${currentUserId}`;
        }

        function renderizarChatDesdeStorage() {
            chatBox.innerHTML = '';
            try {
                const guardado = localStorage.getItem(obtenerClaveChatLocal());
                if (guardado) {
                    const mensajesGuardados = JSON.parse(guardado);
                    if (Array.isArray(mensajesGuardados) && mensajesGuardados.length > 0) {
                        historial = [];
                        mensajesGuardados.forEach(m => {
                            const div = document.createElement('div');
                            div.className = `message ${m.sender === 'user' ? 'user' : 'assistant'}`;
                            div.innerHTML = m.sender === 'user' ? m.text : formatearTexto(m.text);
                            chatBox.appendChild(div);

                            historial.push({
                                role: m.sender === 'user' ? 'user' : 'model',
                                parts: [{ text: m.text }]
                            });
                        });
                        if (historial.length > 10) historial = historial.slice(-10);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        return;
                    }
                }
            } catch (e) {}

            // Si no hay historial previo, mostramos el mensaje inicial
            chatBox.innerHTML = `<div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>`;
        }

        function guardarMensajeEnChatLocal(sender, text) {
            try {
                const clave = obtenerClaveChatLocal();
                const actual = JSON.parse(localStorage.getItem(clave) || '[]');
                actual.push({ sender, text, ts: Date.now() });
                // Guardamos solo los últimos 30 mensajes en el dispositivo para que vaya ligero
                const recortado = actual.slice(-30);
                localStorage.setItem(clave, JSON.stringify(recortado));
            } catch (e) {}
        }

        function limpiarChatLocal() {
            localStorage.removeItem(obtenerClaveChatLocal());
            historial = [];
            chatBox.innerHTML = `<div class="message assistant">Memoria de conversación limpiada. ¿Qué gestionamos ahora?</div>`;
        }

        // =========================================================================
        // 2. GESTIÓN DE ATAJOS
        // =========================================================================
        function obtenerClaveStorageAtajos() {
            return `jarvis_shortcuts_${currentUserId}`;
        }

        function cargarAtajosUsuario() {
            try {
                const guardados = localStorage.getItem(obtenerClaveStorageAtajos());
                if (guardados) {
                    const parsed = JSON.parse(guardados);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...ATAJOS_POR_DEFECTO];
        }

        function guardarAtajosEnStorage(lista) {
            localStorage.setItem(obtenerClaveStorageAtajos(), JSON.stringify(lista));
            renderizarBarraAtajos();
            renderizarListaModalAtajos();
        }

        function renderizarBarraAtajos() {
            const container = document.getElementById('quick-actions-container');
            const atajos = cargarAtajosUsuario();
            container.innerHTML = '';

            atajos.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.disabled = isGenerating;
                btn.innerHTML = `${item.icon ? item.icon + ' ' : ''}${item.label}`;
                btn.onclick = () => enviarRapido(item.prompt);
                container.appendChild(btn);
            });

            const manageBtn = document.createElement('button');
            manageBtn.className = 'chip-action';
            manageBtn.innerHTML = '<span>＋ Atajo</span>';
            manageBtn.onclick = abrirModalAtajos;
            container.appendChild(manageBtn);
        }

        function abrirModalAtajos() {
            resetFormularioAtajo();
            renderizarListaModalAtajos();
            shortcutsModal.style.display = 'flex';
        }

        function cerrarModalAtajos() {
            shortcutsModal.style.display = 'none';
        }

        function renderizarListaModalAtajos() {
            const listEl = document.getElementById('shortcuts-list');
            const atajos = cargarAtajosUsuario();
            listEl.innerHTML = '';

            atajos.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'shortcut-item';
                row.innerHTML = `
                    <div class="shortcut-info">
                        <div class="shortcut-icon-preview">${item.icon || '⚡'}</div>
                        <div class="shortcut-text-group">
                            <div class="shortcut-title">${item.label}</div>
                            <div class="shortcut-prompt">${item.prompt}</div>
                        </div>
                    </div>
                    <div class="shortcut-item-actions">
                        <button class="mini-btn" onclick="prepararEdicionAtajo(${idx})">Editar</button>
                        <button class="mini-btn delete" onclick="eliminarAtajo(${idx})">Borrar</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function prepararEdicionAtajo(index) {
            const atajos = cargarAtajosUsuario();
            const item = atajos[index];
            if (!item) return;
            document.getElementById('form-shortcut-title').textContent = 'Editar atajo';
            document.getElementById('shortcutIconInput').value = item.icon || '';
            document.getElementById('shortcutLabelInput').value = item.label;
            document.getElementById('shortcutPromptInput').value = item.prompt;
            document.getElementById('shortcutEditIndex').value = String(index);
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
        }

        function resetFormularioAtajo() {
            document.getElementById('form-shortcut-title').textContent = 'Añadir nuevo atajo';
            document.getElementById('shortcutIconInput').value = '';
            document.getElementById('shortcutLabelInput').value = '';
            document.getElementById('shortcutPromptInput').value = '';
            document.getElementById('shortcutEditIndex').value = '-1';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function guardarAtajo() {
            const icon = document.getElementById('shortcutIconInput').value.trim();
            const label = document.getElementById('shortcutLabelInput').value.trim();
            const prompt = document.getElementById('shortcutPromptInput').value.trim();
            const editIdx = parseInt(document.getElementById('shortcutEditIndex').value, 10);

            if (!label || !prompt) return alert('Rellena la etiqueta y el prompt del atajo.');

            const atajos = cargarAtajosUsuario();
            if (editIdx >= 0 && editIdx < atajos.length) {
                atajos[editIdx] = { icon, label, prompt };
            } else {
                atajos.push({ icon, label, prompt });
            }

            guardarAtajosEnStorage(atajos);
            resetFormularioAtajo();
        }

        function eliminarAtajo(index) {
            const atajos = cargarAtajosUsuario();
            atajos.splice(index, 1);
            guardarAtajosEnStorage(atajos);
        }

        function setEstadoGenerando(activo) {
            isGenerating = activo;
            userInput.disabled = activo;
            sendBtn.disabled = activo;
            micBtn.disabled = activo;
            document.querySelectorAll('.chip').forEach(btn => btn.disabled = activo);
        }

        function actualizarEstadoConexion(estado) {
            const dot = document.querySelector('.status-dot');
            if (!dot) return;
            if (estado === 'online') {
                dot.style.backgroundColor = '#22c55e';
                dot.style.boxShadow = '0 0 8px #22c55e';
            } else {
                dot.style.backgroundColor = '#ef4444';
                dot.style.boxShadow = '0 0 8px #ef4444';
            }
        }

        // =========================================================================
        // 3. INICIALIZACIÓN Y AUTH SUPABASE
        // =========================================================================
        function crearClienteSupabase(url, key) {
            if (supabaseClient) return supabaseClient;
            supabaseClient = supabase.createClient(url, key, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    lock: async (_name, _acquireTimeout, fn) => await fn()
                }
            });

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                currentSession = session || null;
                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                    renderizarChatDesdeStorage();
                }
            });

            return supabaseClient;
        }

        async function initApp() {
            renderizarBarraAtajos();
            renderizarChatDesdeStorage();

            if (typeof supabase === 'undefined' || !supabase.createClient) {
                setTimeout(initApp, 300);
                return;
            }

            try {
                const res = await fetch('/api');
                if (!res.ok) throw new Error(`Error HTTP ${res.status} en /api`);
                
                const config = await res.json();
                if (!config.supabaseUrl || !config.supabaseAnonKey) {
                    throw new Error("Faltan SUPABASE_URL o SUPABASE_KEY en Vercel.");
                }

                localStorage.setItem('jarvis_supa_config', JSON.stringify(config));
                crearClienteSupabase(config.supabaseUrl, config.supabaseAnonKey);

                if (tokensOAuthUrl) {
                    await supabaseClient.auth.setSession(tokensOAuthUrl);
                    tokensOAuthUrl = null;
                    window.history.replaceState(null, '', window.location.pathname);
                }

                const { data: { session } } = await supabaseClient.auth.getSession();
                currentSession = session || null;

                if (session) {
                    currentUserId = session.user.id;
                    if (session.provider_token) {
                        localStorage.setItem('jarvis_google_token', session.provider_token);
                    }
                    authModal.style.display = 'none';
                    renderizarBarraAtajos();
                    renderizarChatDesdeStorage();
                } else {
                    authModal.style.display = 'flex';
                }
                actualizarEstadoConexion('online');
            } catch (e) {
                console.error("❌ Error inicializando Supabase:", e);
                actualizarEstadoConexion('offline');
                authModal.style.display = 'flex';
            }
        }

        initApp();

        async function loginGoogle() {
            try {
                if (!supabaseClient) await initApp();
                if (!supabaseClient) return;
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin,
                        scopes: 'https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/calendar',
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent'
                        }
                    }
                });
                if (error) alert('Error al conectar con Google: ' + error.message);
            } catch (err) {
                alert('Error en login: ' + err.message);
            }
        }

        async function logout() {
            currentSession = null;
            localStorage.removeItem('jarvis_google_token');
            Object.keys(localStorage).forEach(k => {
                if (k.startsWith('sb-')) localStorage.removeItem(k);
            });

            if (supabaseClient) {
                try {
                    await Promise.race([
                        supabaseClient.auth.signOut(),
                        new Promise(resolve => setTimeout(resolve, 800))
                    ]);
                } catch (e) {}
            }
            window.location.href = window.location.origin;
        }

        // =========================================================================
        // 4. MOTOR AVANZADO DE PUNTUACIÓN Y FORMATO DE TRANSCRIPCIÓN (ESPAÑOL)
        // =========================================================================
        function procesarTextoVoz(texto) {
            if (!texto) return '';
            let t = texto.replace(/\s+/g, ' ').trim();

            // 1. Comandos de puntuación hablados explícitos
            t = t
                .replace(/\b(punto y aparte|punto y seguido)\b/gi, '.')
                .replace(/\bdos puntos\b/gi, ':')
                .replace(/\bpunto y coma\b/gi, ';')
                .replace(/\babrir interrogaci[oó]n\b/gi, '¿')
                .replace(/\bcerrar interrogaci[oó]n\b/gi, '?');

            // 2. Coma tras muletillas e interjecciones de apertura habituales al hablar con Jarvis
            t = t.replace(/^(oye jarvis|hola jarvis|jarvis|vale a ver|a ver|vale|bueno|mira|oye|por cierto|escucha)\s+(?=[a-záéíóúñ])/i, (match) => {
                return match.trim() + ', ';
            });

            // 3. Comas automáticas antes de conectores adversativos, explicativos y consecutivos
            const conectoresConComa = [
                'pero', 'aunque', 'sin embargo', 'no obstante', 'además',
                'por cierto', 'es decir', 'o sea', 'por tanto', 'por lo tanto',
                'así que', 'entonces', 'de hecho', 'en cambio', 'mientras que', 'ya que'
            ];
            conectoresConComa.forEach(conector => {
                const regex = new RegExp(`([^.,;¿?¡!])\\s+\\b(${conector})\\b`, 'gi');
                t = t.replace(regex, '$1, $2');
            });

            // 4. Limpiar posibles espacios antes de signos de puntuación
            t = t.replace(/\s+([.,;:?!])/g, '$1').replace(/,+/g, ',');

            // 5. Dividir por oraciones para capitalizar y detectar preguntas individuales
            let oraciones = t.split(/(?<=[.?!])\s+/);
            oraciones = oraciones.map(oracion => {
                let s = oracion.trim();
                if (!s) return '';

                // Capitalizar primera letra de la oración
                s = s.charAt(0).toUpperCase() + s.slice(1);

                // Detectar si la oración (o la última cláusula tras una coma) es una pregunta
                const patronPreguntaInicio = /^(¿)?(qué|que|cuándo|cuando|dónde|donde|cómo|como|quién|quien|cuánto|cuanto|cuántos|cuantas|cuál|cual|por qué|por que|me puedes decir|dime qué|dime cuánto|sabes si|tengo algún|tengo alguna|hay algún|hay alguna)\b/i;
                const patronPreguntaMitad = /,\s*(y\s+)?(qué|cuándo|dónde|cómo|quién|cuánto|cuántas|cuál|por qué|tengo algún|hay algún)\b/i;

                const tieneCierre = /[.?!]$/.test(s);

                if (patronPreguntaInicio.test(s)) {
                    if (!s.startsWith('¿')) s = '¿' + s.charAt(0).toUpperCase() + s.slice(1);
                    s = s.replace(/[.!]+$/, '') + (s.endsWith('?') ? '' : '?');
                } else if (patronPreguntaMitad.test(s)) {
                    // Si la pregunta empieza después de una coma (ej: "Apúntame pan, ¿y qué tengo hoy?")
                    s = s.replace(/,\s*((?:y\s+)?(?:qué|cuándo|dónde|cómo|quién|cuánto|cuántas|cuál|por qué|tengo algún|hay algún)\b.*)/i, (m, sub) => {
                        const subLimpio = sub.replace(/[.?!]+$/, '');
                        return `, ¿${subLimpio}?`;
                    });
                } else if (!tieneCierre) {
                    s += '.';
                }

                return s;
            });

            return oraciones.join(' ');
        }

        function formatearTexto(texto) {
            return String(texto || '')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function enviarRapido(texto) {
            if (isGenerating) return;
            userInput.value = texto;
            enviarMensaje();
        }

        // =========================================================================
        // 5. GRABACIÓN CONTINUA SIN CORTES + ONDAS EN TIEMPO REAL (WEB AUDIO API)
        // =========================================================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let voiceState = 'idle'; // 'idle' | 'recording' | 'paused'
        let shouldKeepListening = false;
        let finalTranscriptAccumulated = '';
        let interimTranscriptCurrent = '';

        // Variables de Web Audio API para mover las barras con la voz real
        let audioCtx = null;
        let analyserNode = null;
        let micMediaStream = null;
        let animFrameId = null;

        async function iniciarVisualizadorOndasReal() {
            try {
                if (!micMediaStream) {
                    micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const source = audioCtx.createMediaStreamSource(micMediaStream);
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 64;
                analyserNode.smoothingTimeConstant = 0.75;
                source.connect(analyserNode);

                const bufferLength = analyserNode.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function renderWaveFrame() {
                    if (voiceState !== 'recording') return;
                    analyserNode.getByteFrequencyData(dataArray);

                    for (let i = 0; i < NUM_WAVE_BARS; i++) {
                        // Mapeamos las frecuencias centrales de la voz humana de forma simétrica
                        const distFromCenter = Math.abs(i - NUM_WAVE_BARS / 2);
                        const freqIdx = Math.min(Math.floor(distFromCenter) + 1, bufferLength - 1);
                        const valor = dataArray[freqIdx] || 0;
                        const alturaPx = Math.max(4, Math.min(28, Math.round((valor / 255) * 28)));
                        waveBarElements[i].style.height = `${alturaPx}px`;
                    }
                    animFrameId = requestAnimationFrame(renderWaveFrame);
                }

                cancelAnimationFrame(animFrameId);
                renderWaveFrame();
            } catch (e) {
                // Fallback suave si el navegador bloquea el stream secundario
                iniciarFallbackOndasSuaves();
            }
        }

        function iniciarFallbackOndasSuaves() {
            function renderFallback() {
                if (voiceState !== 'recording') return;
                const t = Date.now() / 140;
                for (let i = 0; i < NUM_WAVE_BARS; i++) {
                    const h = 5 + Math.round((Math.sin(t + i * 0.45) + 1) * 8);
                    waveBarElements[i].style.height = `${h}px`;
                }
                animFrameId = requestAnimationFrame(renderFallback);
            }
            cancelAnimationFrame(animFrameId);
            renderFallback();
        }

        function detenerVisualizadorOndasReal(cerrarStream = true) {
            cancelAnimationFrame(animFrameId);
            waveBarElements.forEach(b => b.style.height = '4px');
            if (cerrarStream && micMediaStream) {
                micMediaStream.getTracks().forEach(track => track.stop());
                micMediaStream = null;
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let nuevoFinal = '';
                let nuevoInterim = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const pieza = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        nuevoFinal += pieza + ' ';
                    } else {
                        nuevoInterim += pieza;
                    }
                }

                if (nuevoFinal) {
                    // Si hubo una pausa y el bloque anterior no tenía puntuación, añadimos coma suave
                    if (
                        finalTranscriptAccumulated.trim().length > 0 &&
                        !/[.,;?!]$/.test(finalTranscriptAccumulated.trim())
                    ) {
                        finalTranscriptAccumulated = finalTranscriptAccumulated.trim() + ', ' + nuevoFinal.trimStart();
                    } else {
                        finalTranscriptAccumulated += nuevoFinal;
                    }
                }

                interimTranscriptCurrent = nuevoInterim;
                const combinado = (finalTranscriptAccumulated + interimTranscriptCurrent).replace(/\s+/g, ' ').trimStart();
                userInput.value = combinado;
                ajustarAlturaInput();
                userInput.scrollTop = userInput.scrollHeight;
            };

            recognition.onerror = (event) => {
                // Ignoramos 'no-speech' para que NO se corte cuando te quedas callado pensando
                if (event.error === 'no-speech') return;
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    shouldKeepListening = false;
                    finalizarEstadoUI();
                }
            };

            recognition.onend = () => {
                // AUTO-REINICIO INFINITO: Si Android corta tras silencio pero tú no has pausado ni enviado, sigue escuchando
                if (shouldKeepListening && voiceState === 'recording') {
                    setTimeout(() => {
                        if (shouldKeepListening && voiceState === 'recording') {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 50);
                }
            };
        }

        function actualizarIconoPausaReanudar() {
            if (voiceState === 'paused') {
                // Icono Play (Reanudar)
                pauseIconSvg.innerHTML = `<polygon points="6 4 20 12 6 20 6 4"></polygon>`;
                audioStatusText.textContent = 'EN PAUSA';
                inputArea.classList.remove('listening');
                inputArea.classList.add('paused');
            } else {
                // Icono Pausa
                pauseIconSvg.innerHTML = `
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                `;
                audioStatusText.textContent = 'ESCUCHANDO';
                inputArea.classList.remove('paused');
                inputArea.classList.add('listening');
            }
        }

        function finalizarEstadoUI() {
            voiceState = 'idle';
            shouldKeepListening = false;
            inputArea.classList.remove('listening', 'paused');
            detenerVisualizadorOndasReal(true);
            ajustarAlturaInput();
        }

        function iniciarDictadoContinuo() {
            if (isGenerating) return;
            if (!recognition) return alert('Tu navegador no soporta dictado por voz.');

            // Conservamos cualquier texto que ya estuviera escrito en la caja
            finalTranscriptAccumulated = userInput.value.trim();
            if (finalTranscriptAccumulated) finalTranscriptAccumulated += ' ';
            interimTranscriptCurrent = '';

            voiceState = 'recording';
            shouldKeepListening = true;
            actualizarIconoPausaReanudar();

            try {
                recognition.start();
            } catch (e) {}

            iniciarVisualizadorOndasReal();
        }

        function pausarReanudarDictado() {
            if (!recognition) return;

            if (voiceState === 'recording') {
                // Pasar a PAUSA
                voiceState = 'paused';
                shouldKeepListening = false;
                try { recognition.stop(); } catch (e) {}
                detenerVisualizadorOndasReal(false);
                // Pulimos con comas y puntos lo que lleva dicho hasta ahora
                userInput.value = procesarTextoVoz(userInput.value);
                finalTranscriptAccumulated = userInput.value + ' ';
                interimTranscriptCurrent = '';
                actualizarIconoPausaReanudar();
            } else if (voiceState === 'paused') {
                // REANUDAR grabación
                finalTranscriptAccumulated = userInput.value.trim();
                if (finalTranscriptAccumulated) finalTranscriptAccumulated += ' ';
                interimTranscriptCurrent = '';
                voiceState = 'recording';
                shouldKeepListening = true;
                actualizarIconoPausaReanudar();
                try { recognition.start(); } catch (e) {}
                iniciarVisualizadorOndasReal();
            }
        }

        function cancelarDictado() {
            shouldKeepListening = false;
            voiceState = 'idle';
            try { if (recognition) recognition.stop(); } catch (e) {}
            finalTranscriptAccumulated = '';
            interimTranscriptCurrent = '';
            userInput.value = '';
            finalizarEstadoUI();
        }

        // =========================================================================
        // 6. ENVÍO DE MENSAJES AL SERVIDOR
        // =========================================================================
        async function enviarMensaje() {
            if (isGenerating) return;

            // Si estaba grabando o en pausa, detenemos el micro al instante y enviamos
            if (voiceState !== 'idle') {
                shouldKeepListening = false;
                voiceState = 'idle';
                try { if (recognition) recognition.stop(); } catch (e) {}
                finalizarEstadoUI();
            }

            if (!supabaseClient) {
                await initApp();
            }

            let text = userInput.value.trim();
            if (!text) return;

            text = procesarTextoVoz(text);

            const { data: { session } } = await supabaseClient.auth.getSession();
            const sesionActiva = session || currentSession;

            if (!sesionActiva) {
                authModal.style.display = 'flex';
                return;
            }

            setEstadoGenerando(true);

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            guardarMensajeEnChatLocal('user', text);

            userInput.value = '';
            finalTranscriptAccumulated = '';
            interimTranscriptCurrent = '';
            ajustarAlturaInput();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const googleToken = sesionActiva.provider_token || localStorage.getItem('jarvis_google_token') || '';

                const res = await fetch('/api', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sesionActiva.access_token}`,
                        'X-Google-Token': googleToken
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                const data = await res.json().catch(() => ({}));

                if (res.status === 401) {
                    chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">${data.error || 'Sesión expirada. Pulsa en Salir y vuelve a entrar.'}</div>`;
                    authModal.style.display = 'flex';
                    setEstadoGenerando(false);
                    return;
                }

                const reply = data.reply || data.error || 'Sin respuesta del servidor.';
                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}</div>`;
                guardarMensajeEnChatLocal('assistant', reply);
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">Error de conexión: ${err.message}</div>`;
            } finally {
                setEstadoGenerando(false);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => reg.update())
                    .catch((err) => console.log("Error al registrar el Service Worker:", err));
            });
        }
    </script>
</body>
</html>
