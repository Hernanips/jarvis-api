<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        header { padding: 20px; background: #1e293b; border-bottom: 1px solid #334155; text-align: center; font-weight: bold; letter-spacing: 1px; color: #38bdf8; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.5; font-size: 14px; }
        .user { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background: #1e293b; color: #f8fafc; align-self: flex-start; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; }
        input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; font-size: 14px; }
        input:focus { border-color: #38bdf8; }
        button { padding: 0 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <header>JARVIS // TERMINAL CENTRAL V1</header>
    
    <div id="chat-box">
        <div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas pendientes metemos hoy?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu orden (ej: Me comí una ensalada y apúntame examen el lunes)..." autofocus>
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        let historial = []; // <-- Memoria de la sesión actual

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        async function enviarMensaje() {
            const text = userInput.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: historial }) // <-- Enviamos memoria
                });
                const data = await res.json();
                const reply = data.reply || data.error;

                chatBox.innerHTML += `<div class="message assistant">${reply}</div>`;
                
                // Guardamos el intercambio en la memoria (últimos 10 mensajes)
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">Error de conexión con el servidor.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
