<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #121215;
            --bg-card: #18181b;
            --border: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #ef4444; /* Toque rojo estilo Nothing / o cámbialo a #38bdf8 si prefieres azul */
            --user-msg: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 14px 20px;
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .lock-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        /* QUICK ACTIONS */
        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            overflow-x: auto;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .quick-actions::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chip:hover { color: var(--text-main); border-color: #52525b; background: #27272a; }

        /* CHAT AREA */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            scroll-behavior: smooth;
        }

        .message {
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 82%;
            line-height: 1.55;
            font-size: 14.5px;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--text-main);
            color: var(--bg-main);
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: var(--bg-card);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .assistant strong { color: #fff; font-weight: 600; }

        /* TYPING INDICATOR */
        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* INPUT BAR */
        .input-wrapper {
            padding: 14px 20px 20px;
            background: var(--bg-main);
            border-top: 1px solid var(--border);
        }

        .input-area {
            display: flex;
            gap: 8px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            transition: border-color 0.2s;
        }
        .input-area:focus-within { border-color: #52525b; }

        input {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-size: 14.5px;
        }
        input::placeholder { color: #52525b; }

        .icon-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: #27272a; color: var(--text-main); }
        .icon-btn.recording { color: var(--accent); animation: pulse 1s infinite; }

        .send-btn {
            padding: 0 18px;
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .send-btn:hover { opacity: 0.9; }

        /* MODAL DE SEGURIDAD (PIN) */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .modal-card input {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- MODAL DE ACCESO -->
    <div id="auth-modal">
        <div class="modal-card">
            <h2>🔒 JARVIS // ACCESO</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Introduce tu clave de acceso para sincronizar con tus tareas y base de datos.</p>
            <input type="password" id="pinInput" placeholder="••••••••">
            <button class="send-btn" style="padding: 12px;" onclick="guardarPin()">Desbloquear</button>
        </div>
    </div>

    <header>
        <div class="brand">
            <span class="status-dot"></span>
            JARVIS // CORE V2
        </div>
        <button class="lock-btn" onclick="pedirPin()">🔑 Clave</button>
    </header>

    <div class="quick-actions">
        <button class="chip" onclick="enviarRapido('¿Cómo llevo el día? Dime tareas pendientes y calorías')">📋 Resumen del día</button>
        <button class="chip" onclick="enviarRapido('¿Qué tengo pendiente en Project OBSCURA?')">🎮 Project OBSCURA</button>
        <button class="chip" onclick="enviarRapido('¿Cómo llevo las tareas de la Pecera?')">🐟 Estado Pecera</button>
        <button class="chip" onclick="enviarRapido('¿Qué tareas tengo pendientes de la Uni?')">🎨 Uni</button>
    </div>
    
    <div id="chat-box">
        <div class="message assistant">Sistema online. ¿Qué hemos comido o qué tareas gestionamos hoy?</div>
    </div>

    <div class="input-wrapper">
        <div class="input-area">
            <button class="icon-btn" id="micBtn" onclick="toggleDictado()" title="Hablar">🎤</button>
            <input type="text" id="userInput" placeholder="Escribe o dicta tu orden..." autofocus>
            <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const authModal = document.getElementById('auth-modal');
        const pinInput = document.getElementById('pinInput');
        let historial = [];

        // Comprobar si hay PIN guardado al abrir la web
        if (!localStorage.getItem('jarvis_pin')) {
            authModal.style.display = 'flex';
        }

        function pedirPin() {
            pinInput.value = localStorage.getItem('jarvis_pin') || '';
            authModal.style.display = 'flex';
            pinInput.focus();
        }

        function guardarPin() {
            const val = pinInput.value.trim();
            if (val) {
                localStorage.setItem('jarvis_pin', val);
                authModal.style.display = 'none';
                userInput.focus();
            }
        }

        // Formatear negritas y saltos de línea de Gemini
        function formatearTexto(texto) {
            return texto
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        function enviarRapido(texto) {
            userInput.value = texto;
            enviarMensaje();
        }

        async function enviarMensaje() {
            const text = userInput.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            userInput.value = '';

            // Indicador de carga
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="typing" id="${loadingId}"><span></span><span></span><span></span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-jarvis-pin': localStorage.getItem('jarvis_pin') || ''
                    },
                    body: JSON.stringify({ message: text, history: historial })
                });

                document.getElementById(loadingId)?.remove();

                if (res.status === 401) {
                    chatBox.innerHTML += `<div class="message assistant" style="border-color: #ef4444; color: #f87171;">🔒 Clave incorrecta. Pulsa en "🔑 Clave" arriba a la derecha para introducir tu PIN.</div>`;
                    pedirPin();
                    return;
                }

                const data = await res.json();
                const reply = data.reply || data.error;

                chatBox.innerHTML += `<div class="message assistant">${formatearTexto(reply)}</div>`;
                
                historial.push({ role: 'user', parts: [{ text }] });
                historial.push({ role: 'model', parts: [{ text: reply }] });
                if (historial.length > 10) historial = historial.slice(-10);

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `<div class="message assistant" style="color: #f87171;">Error de conexión con el servidor.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Reconocimiento de voz nativo para móvil y Chrome
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.onstart = () => document.getElementById('micBtn').classList.add('recording');
            recognition.onend = () => document.getElementById('micBtn').classList.remove('recording');
            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
                enviarMensaje();
            };
        }

        function toggleDictado() {
            if (!recognition) return alert('Tu navegador no soporta dictado por voz.');
            recognition.start();
        }
    </script>
</body>
</html>
